<style>
:root{--soil:#2b2118;--leaf:#2f6b3a;--paddy:#eef2e3;--card:#fff;--green:#3c8d4a;--amber:#d9a21b;--red:#b8402f;--mut:#6b6558}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);font:16px/1.5 'Nunito Sans','Noto Sans Tamil',system-ui,sans-serif;background:var(--paddy);color:var(--soil)}
h1,h2,h3{font-family:Fraunces,'Noto Sans Tamil',Georgia,serif;margin:.2em 0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px 90px}
.center{text-align:center;padding-top:22vh}
.logo{font-family:Fraunces,serif;font-weight:800;font-size:2.4rem;color:var(--leaf)}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;border:1px solid #d9dcc8}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #b9bea5;border-radius:10px;font:inherit;background:#fff}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;background:var(--leaf);color:#fff;cursor:pointer;width:100%;margin-top:8px}
button.alt{background:#fff;color:var(--leaf);border:2px solid var(--leaf)}
button.link{background:none;color:var(--leaf);width:auto;padding:4px;text-decoration:underline}
button.icon{width:44px;flex:0 0 44px;padding:10px;font-size:1.1rem}
.row{display:flex;gap:8px;align-items:stretch}
.err{color:var(--red);font-weight:700;min-height:1.4em}.ok{color:var(--green);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paddy);border-radius:10px;padding:10px}.tile b{display:block;font-size:1.4rem}
.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}
.big{font:800 3rem Fraunces,serif;line-height:1}
.dec{font:800 1.8rem Fraunces,serif}
.zone{padding:18px 8px;border-radius:12px;color:#fff;text-align:center;font-weight:700;border:3px solid transparent;margin:0}
.zone.sel{border-color:var(--soil)}
.bg-green{background:var(--green)}.bg-amber{background:var(--amber)}.bg-red{background:var(--red)}
nav{position:fixed;bottom:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))!important;left:0;right:0;background:var(--soil);display:flex;overflow-x:auto;padding:6px}
nav button{background:none;width:auto;white-space:nowrap;margin:0;padding:10px 12px;color:#cfc8b8;font-size:.9rem}
nav button.on{color:#fff;background:var(--leaf)}
.bubble{padding:10px 12px;border-radius:12px;margin:6px 0;max-width:85%;position:relative}
.me{background:var(--leaf);color:#fff;margin-left:auto}.ai{background:var(--paddy)}
.spk{background:none;color:var(--leaf);width:auto;padding:2px 6px;margin:2px 0 0;font-size:.85rem}
.alert{border-left:6px solid var(--amber);cursor:pointer}.alert.red{border-color:var(--red)}
small,.mut{color:var(--mut)}
svg{width:100%;height:110px}
.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:8px}
.statrow div{background:var(--paddy);border-radius:10px;padding:8px}
.mic.on{background:var(--red)}
@media(prefers-reduced-motion:no-preference){.fade{animation:f .8s}@keyframes f{from{opacity:0}}}
</style></head>

/* ---------- 1 splash ---------- */
function splash(){
  app.innerHTML=`<div class="center fade"><div class="logo">🌱 ${t('appName')}</div><p>${t('tagline')}</p><p class="mut">${t('loading')}</p></div>`;
  setTimeout(()=>{const e=LS('cs_session');U=users().find(u=>u.email===e)||null;U?go(U.farm?'main':'farm'):go('login')},1800);
}
/* ---------- 2 login ---------- */
function login(){
  app.innerHTML=`<div class="center" style="padding-top:8vh"><div class="logo">🌱 ${t('appName')}</div></div>
  <div class="card"><h2>${t('login')}</h2>
  <input id="id" placeholder="${t('emailOrPhone')}" autocomplete="username">
  <input id="pw" type="password" placeholder="${t('password')}" autocomplete="current-password">
  <button class="link" onclick="pw.type=pw.type=='password'?'text':'password'">${t('showHide')}</button>
  <p class="err" id="e"></p>
  <button onclick="doLogin()">${t('login')}</button>
  <button class="link" onclick="err(t('forgotMsg'))">${t('forgot')}</button>
  <button class="alt" onclick="go('register')">${t('newFarmer')}</button></div>`;
}
function doLogin(){
  const id=val('id'),pw=$('#pw').value;
  if(!id)return err(t('errEmail'));
  if(!pw)return err(t('errPassword'));
  const u=users().find(x=>(x.email===id||x.phone===id)&&x.pw===btoa(pw));
  if(!u)return err(t('errInvalidLogin'));
  if(!u.verified){pending=u;return sendOtp()}
  U=u;SS('cs_session',u.email);go(u.farm?'main':'farm');
}
/* ---------- 3 register ---------- */
function register(){
  app.innerHTML=`<div class="card"><h2>${t('createAccount')}</h2>
  <input id="n" placeholder="${t('fullName')}"><input id="ph" placeholder="${t('mobile')}" inputmode="numeric">
  <input id="em" placeholder="${t('email')}"><input id="p1" type="password" placeholder="${t('passMin')}">
  <input id="p2" type="password" placeholder="${t('confirmPass')}"><p class="err" id="e"></p>
  <button onclick="doReg()">${t('createAccount')}</button><button class="alt" onclick="go('login')">${t('backLogin')}</button></div>`;
}
function doReg(){
  const n=val('n'),ph=val('ph'),em=val('em').toLowerCase(),p1=$('#p1').value,p2=$('#p2').value;
  if(!n)return err(t('errName'));
  if(!/^\d{10}$/.test(ph))return err(t('errPhone'));
  if(!/^\S+@\S+\.\S+$/.test(em))return err(t('errEmailInvalid'));
  if(p1.length<8)return err(t('errPassLen'));
  if(p1!==p2)return err(t('errPassMismatch'));
  if(users().some(u=>u.email===em||u.phone===ph))return err(t('errExists'));
  pending={name:n,phone:ph,email:em,pw:btoa(p1),verified:false,farm:null};saveUser(pending);sendOtp();
}
/* ---------- 4 verify ---------- */
function sendOtp(){otp=String(100000+Math.random()*900000|0);go('verify')}
function verify(){
  app.innerHTML=`<div class="card"><h2>${t('verifyTitle')}</h2><p>${t('verifySub')}</p>
  <p class="tile">${t('demoOtp')}: <b>${otp}</b></p><input id="o" placeholder="${t('enterOtp')}" inputmode="numeric"><p class="err" id="e"></p>
  <button onclick="doVerify()">${t('verify')}</button></div>`;
}
function doVerify(){
  if(val('o')!==otp)return err(t('errOtp'));
  pending.verified=true;saveUser(pending);U=pending;SS('cs_session',U.email);
  app.innerHTML=`<div class="card"><p class="ok">${t('verifiedOk')}</p><button onclick="go('farm')">${t('continueFarm')}</button></div>`;
}
/* ---------- 5 farm setup ---------- */
function farm(){
  const f=U.farm||{};
  app.innerHTML=`<div class="card"><h2>${t('setupFarm')}</h2>
  <input id="fn" placeholder="${t('farmName')}" value="${f.name||''}"><input id="lo" placeholder="${t('location')}" value="${f.loc||''}">
  <input id="sz" type="number" min="0.1" step="0.1" placeholder="${t('farmSize')}" value="${f.size||''}">
  <input id="cr" placeholder="${t('cropType')}" value="${f.crop||''}">
  <select id="so">${OPT_SOIL.map(s=>`<option value="${s.en}" ${f.soil==s.en?'selected':''}>${s[LANG]||s.en}</option>`).join('')}</select>
  <select id="ir">${OPT_IRR.map(s=>`<option value="${s.en}" ${f.irr==s.en?'selected':''}>${s[LANG]||s.en}</option>`).join('')}</select>
  <p class="err" id="e"></p><button onclick="saveFarm()">${t('saveFarm')}</button></div>`;
}
function saveFarm(){
  const f={name:val('fn'),loc:val('lo'),size:val('sz'),crop:val('cr'),soil:$('#so').value,irr:$('#ir').value};
  if(!f.name||!f.loc||!f.size||!f.crop)return err(t('errFarmFields'));
  U.farm=f;saveUser(U);tab='home';go('main');
}

 <div class="row"><input id="in" placeholder="${t('askPlaceholder')}">${SR?`<button class="icon mic" id="micBtn">🎤</button>`:''}<button class="icon" id="sendBtn" style="flex:0 0 60px">${t('send')}</button></div>
 ${listening?`<p class="mut">${t('listening')}</p>`:''}</div>`,
his:()=>{const H=getHistory();const st=(d)=>({avg:Math.round(d.reduce((a,b)=>a+b,0)/d.length),max:Math.max(...d),min:Math.min(...d)});
 const sm=st(H.m);
 return `<div class="card"><h3>${t('historyTitle')}</h3><b class="ok">${t('waterSaved')}: 1,250 L</b>
 <div class="statrow"><div><small>${t('avg')} ${t('soilMoisture').split(' ')[0]}</small><br><b>${sm.avg}%</b></div>
 <div><small>${t('best')}</small><br><b class="green">${sm.max}%</b></div><div><small>${t('worst')}</small><br><b class="red">${sm.min}%</b></div></div>
 <button class="alt" id="csvBtn">${t('exportCsv')}</button></div>`+
 [['soilMoistureChart',H.m,'#3c8d4a'],['stressRiskChart',H.k,'#b8402f'],['waterUsageChart',H.w,'#2f6b9a']].map(([k,d,c])=>`<div class="card"><b>${t(k)}</b>${chart(d,c)}</div>`).join('')},
pro:()=>`<div class="card"><h3>${t('profileTitle')}</h3><p>${U.name}<br>${U.phone}<br>${U.email}</p></div>
 <div class="card"><h3>${t('farmSettings')}</h3><p>${U.farm.name} · ${U.farm.loc}<br>${U.farm.crop} · ${optLabel(OPT_SOIL,U.farm.soil)} · ${U.farm.size} ${LANG=='ta'?'ஏக்கர்':'acres'} · ${optLabel(OPT_IRR,U.farm.irr)}</p><button class="alt" onclick="go('farm')">${t('editFarm')}</button></div>
 <div class="card"><h3>${t('appSettings')}</h3><label>${t('language')}</label><select id="lg"><option value="en" ${LANG=='en'?'selected':''}>English</option><option value="ta" ${LANG=='ta'?'selected':''}>தமிழ்</option></select>
 <label><input type="checkbox" checked style="width:auto"> ${t('notifications')}</label><br>
 <label><input id="va" type="checkbox" ${LS('voiceOn')!==false?'checked':''} style="width:auto" onchange="SS('voiceOn',this.checked)"> ${t('voiceAssist')}</label>
 <button onclick="SS('cs_session',null);U=null;go('login')">${t('logout')}</button></div>`
};
/* ---------- feature functions ---------- */
function simulate(){
  const tm=+s1.value,m=+s2.value,r=+s3.value,k=risk(tm,m,r);
  so2.innerHTML=`<p>${t('currentRisk')}: <b>${K}%</b></p><p>${t('predictedRisk')}: <b class="big ${col(k)}">${k}%</b></p>${dec(decide(k,m,r),k)}
  <p>${k>K?t('incRisk'):t('decRisk')}</p>`;
}
function analyse(src){
  const out=$('#sr'),im=new Image();
  im.onerror=()=>{out.innerHTML=`<p class="err">${t('invalidImage')}</p>`};
  im.onload=()=>{try{const c=$('#cv').getContext('2d');c.drawImage(im,0,0,64,64);const d=c.getImageData(0,0,64,64).data;let bad=0;
    for(let i=0;i<d.length;i+=4)if(d[i+1]<d[i]*1.05)bad++;
    const leaf=Math.round(bad/4096*100),all=Math.round(.5*leaf+.5*K);
    out.innerHTML=`<img src="${src}" style="max-width:100%;border-radius:10px;margin:8px 0">
    <p>${leaf>35?t('possibleStressDetected'):t('leafHealthy')} (${leaf}%)</p>
    <h3>${t('overallRisk')}: <span class="${col(all)}">${riskWord(all)} (${all}%)</span></h3>
    ${[leaf>35&&t('leafStressDetected'),E.m<=35&&('💧 '+t('soilMoisture')),E.t>=32&&('🌡 '+t('temperature'))].filter(Boolean).map(x=>`<p>• ${x}</p>`).join('')}`}
    catch(e){out.innerHTML=`<p class="err">${t('analysisFailed')}: `+e.message+'</p>'}};
  im.src=src;
}
function scanImg(inp){
  const f=inp.files&&inp.files[0],out=$('#sr');if(!f){out.innerHTML=`<p class="err">${t('noFileChosen')}</p>`;return}
  out.innerHTML=`<p>${t('analysing')}</p>`;const rd=new FileReader();
  rd.onerror=()=>{out.innerHTML=`<p class="err">${t('couldNotRead')}</p>`};
  rd.onload=()=>analyse(rd.result);rd.readAsDataURL(f);
}
function sample(){
  const c=document.createElement('canvas');c.width=c.height=200;const g=c.getContext('2d');
  g.fillStyle='#2f8a3a';g.fillRect(0,0,200,200);
  [[50,60,40,'#b8a23a'],[140,90,35,'#8a5a2a'],[90,150,30,'#c2a93c']].forEach(([x,y,r,cc])=>{g.fillStyle=cc;g.beginPath();g.arc(x,y,r,0,7);g.fill()});
  $('#fname').textContent='sample-leaf';analyse(c.toDataURL('image/png'));
}
/* ---------- assistant + voice ---------- */
/* To use Gemini instead of the rule-based answer() below, call the Gemini API from a backend
   (never put an API key in this file) sending the farm/zone data as context. */
function answer(q){
  q=q.toLowerCase();const m=q.match(/(\d)/),z=m&&Z[m[1]-1],w=[...Z].sort((a,b)=>b.k-a.k)[0];
  const isWhy=/why|ஏன்/.test(q),isWater=/water|irrigat|தண்ணீர்|நீர்|பாசன/.test(q),isForecast=/forecast|tomorrow|முன்னறிவி|நாளை/.test(q);
  if(z&&isWhy)return LANG=='ta'
    ?`மண்டலம் ${z.n} ${z.k>=60?'சிவப்பு':z.k>=35?'மஞ்சள்':'பச்சை'} ஏனெனில் மண் ஈரப்பதம் ${z.m}%, வெப்பநிலை ${z.t}°C, மழை நிகழ்தகவு ${z.r}%, கணிக்கப்பட்ட அழுத்தம் ${z.k}%.`
    :`Zone ${z.n} is ${col(z.k)} because soil moisture is ${z.m}%, temperature is ${z.t}°C, rain probability is ${z.r}% and predicted stress is ${z.k}%.`;
  if(z)return `${t('zone')} ${z.n}: ${t('soilMoisture')} ${z.m}%, ${t('temperature')} ${z.t}°C, ${t('rainProb')} ${z.r}%, ${t('cropStressRisk')} ${z.k}% → ${t('dec'+z.d)}.`;
  if(isWater)return w.d=='WATER'
    ?(LANG=='ta'?`மண்டலம் ${w.n}-இல் மண் ஈரப்பதம் குறைவாக (${w.m}%) மற்றும் மழை நிகழ்தகவு ${w.r}% மட்டுமே. மண்டலம் ${w.n}-க்கு நீர் ஊற்ற பரிந்துரைக்கப்படுகிறது.`
      :`Zone ${w.n} has low soil moisture (${w.m}%) and only ${w.r}% rain probability. WATER is recommended for Zone ${w.n}.`)
    :(LANG=='ta'?'இப்போது எந்த மண்டலத்திற்கும் தண்ணீர் தேவையில்லை. கண்காணிக்கவும்.':'No zone needs water right now. Keep watching.');
  if(isForecast)return (LANG=='ta'?'அழுத்த முன்னறிவிப்பு: ':'Stress risk forecast: ')+F.map(x=>t(x.d)+' '+x.k+'% ('+t('dec'+x.a)+')').join(', ')+'.';
  return LANG=='ta'?'நான் நீர்ப்பாசனம், மண்டல அபாயம் மற்றும் முன்னறிவிப்பு பற்றி பதிலளிக்க முடியும். "மண்டலம் 3 ஏன் சிவப்பு?" எனக் கேளுங்கள்.'
    :'I can answer about watering, zone risk, and the forecast. Try "Why is Zone 3 red?"';
}
function askFarm(){const q=val('in');if(!q)return;$('#in').value='';const a=answer(q);chat.push({t:q.replace(/</g,'&lt;')},{ai:1,t:a});main();
  if(LS('voiceOn')!==false)speak(a);}
function speak(txt){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt.replace(/[🌱🌡💧🌧⚠️✅👋📷🔊🎤️]/g,''));
  u.lang=LANG=='ta'?'ta-IN':'en-IN';window.speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function toggleMic(){
  if(!SR){err&&alert(t('micUnsupported'));return}
  if(listening){rec&&rec.stop();return}
  rec=new SR();rec.lang=LANG=='ta'?'ta-IN':'en-IN';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{listening=true;main()};
  rec.onend=()=>{listening=false;main()};
  rec.onerror=()=>{listening=false;main()};
  rec.onresult=(e)=>{const text=e.results[0][0].transcript;$('#in').value=text;askFarm()};
  rec.start();
}
/* ---------- history + export ---------- */
function getHistory(){const r=(a,b,i)=>Math.round(a+(b-a)*((Math.sin(i*2.7)+1)/2));
  const H={m:[],k:[],w:[]};for(let i=0;i<7;i++){H.m.push(r(30,55,i));H.k.push(r(25,75,i+2));H.w.push(r(400,900,i+4))}return H}
function chart(d,c){const mx=Math.max(...d),mn=Math.min(...d),p=d.map((v,i)=>`${i*50+10},${100-(v-mn)/(mx-mn||1)*80-10}`).join(' ');
  return `<svg viewBox="0 0 310 110"><polyline fill="none" stroke="${c}" stroke-width="3" points="${p}"/></svg>`}
function exportCsv(){
  const H=getHistory();let csv=`${t('day')},${t('soilMoistureChart')},${t('stressRiskChart')},${t('waterUsageChart')}\n`;
  for(let i=0;i<7;i++)csv+=`${i+1},${H.m[i]},${H.k[i]},${H.w[i]}\n`;
  const blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='cropsense-history.csv';a.click();
}
go('splash');
</script></body></html>
